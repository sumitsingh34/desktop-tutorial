<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9661F">
<title>MeraFood</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 36 36' fill='%23141414' stroke='%23141414' stroke-width='0'><rect x='-2' y='-2' width='36' height='36' rx='7' fill='%23D9661F' stroke-width='0'/><circle cx='12' cy='8.5' r='5'/><path d='M2 31c0-8.5 4.3-13.5 10-13.5s10 5 10 13.5z'/><path d='M18.5 20.5l7-7' stroke-width='3.2' stroke-linecap='round' fill='none'/><path d='M27 30V9M24.5 2.5v4.2a2.5 2.5 0 0 0 5 0V2.5M27 2.5v4' stroke-width='2' stroke-linecap='round' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --paper:#ffffff; --ink:#141414; --muted:#6b6862; --rule:#141414; --soft:#ecebe7;
  --gerua:#D9661F; --gerua-ink:#A9480D; --black:#141414; --tomato:#C62828; --field:#f6f5f2;
  --font:"Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#161513; --ink:#f1efe9; --muted:#a19d94; --rule:#f1efe9; --soft:#2a2825; --gerua:#EE7F35; --gerua-ink:#F29A5A; --tomato:#FF6B6B; --field:#201f1c; }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gerua);outline-offset:2px}
.brand{background:var(--gerua);color:var(--black);margin:0 0 6px;padding:12px max(18px, calc((100% - 560px)/2 + 18px));border-bottom:4px solid var(--black);font-weight:900;font-stretch:75%;font-size:1.6rem;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.brand .logo{flex:none}
.wrap{max-width:560px;margin:0 auto;padding:4px 18px 110px}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.datebar h1{margin:0;font-size:1.05rem;font-weight:700;font-stretch:90%}
.iconbtn{background:none;border:0;width:44px;height:44px;font-size:1.5rem;line-height:1;border-radius:50%}
.iconbtn:disabled{opacity:.25}

/* nutrition-label panel */
.label{border:2px solid var(--rule);padding:10px 12px 12px}
.label .title{font-weight:900;font-stretch:70%;font-size:2.4rem;line-height:1;letter-spacing:-.01em;margin:0 0 4px}
.rule-thick{height:10px;background:var(--rule);margin:6px 0}
.rule-mid{height:4px;background:var(--rule);margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);padding:4px 0}
.row:first-of-type{border-top:0}
.row b{font-weight:800}
.remain{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.remain .big{color:var(--gerua);font-weight:900;font-stretch:75%;font-size:3.6rem;line-height:.9;font-variant-numeric:tabular-nums}
.remain .big.over{color:var(--tomato)}
.remain .cap{font-weight:800;font-size:1.05rem}
.bar{height:8px;background:var(--soft);margin:10px 0 4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gerua)}
.bar i.over{background:var(--tomato)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);margin-top:8px}
.macros div{padding:6px 0 0}
.macros div+div{border-left:1px solid var(--rule);padding-left:10px}
.macros.four{grid-template-columns:repeat(4,1fr)}
.macros.four b{font-size:1.05rem}
.macros b{display:block;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.macros span{font-size:.85rem;color:var(--muted)}

/* sections */
section.meal{margin-top:22px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid var(--rule);padding-bottom:3px}
.mhead h2{margin:0;padding-left:10px;border-left:6px solid var(--gerua);font-size:1.25rem;font-weight:800;font-stretch:85%}
.mhead span{font-weight:700;font-variant-numeric:tabular-nums}
.mmac{display:flex;gap:16px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--rule);font-size:.9rem;color:var(--muted)}
.mmac b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--soft);padding:8px 0}
.it-main{flex:1;min-width:0}
.it-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-sub{font-size:.85rem;color:var(--muted)}
.it-kcal{font-weight:700;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--muted);width:36px;height:36px;font-size:1.2rem;border-radius:50%}
.addline{background:none;border:0;padding:10px 0;font-weight:800;color:var(--gerua-ink)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--black);border-top:0;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:190px;background:none;border:0;padding:14px 0;font-weight:700;color:#b9b4aa}
nav.tabs button[aria-current="page"]{color:var(--gerua);box-shadow:inset 0 4px 0 var(--gerua)}

/* forms */
label.f{display:block;margin:12px 0 0;font-size:.9rem;font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;background:var(--field);border:1.5px solid var(--soft);border-radius:6px}
label.f input:focus,label.f select:focus{border-color:var(--gerua);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
.primary{display:block;width:100%;margin-top:18px;padding:14px;background:var(--gerua);color:var(--black);border:0;border-radius:6px;font-weight:800;font-size:1.05rem}
.secondary{padding:10px 14px;background:none;border:1.5px solid var(--ink);border-radius:6px;font-weight:700}
.danger{color:var(--tomato);border-color:var(--tomato)}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.95rem}
.check input{width:20px;height:20px}

/* sheet */
dialog{border:0;padding:0;width:100%;max-width:560px;max-height:92vh;margin:auto auto 0;background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0}
@media (min-width:600px){dialog{margin:auto;border-radius:14px}}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h3{margin:0;font-size:1.3rem;font-weight:800;font-stretch:85%}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin:12px 0 4px}
.seg button{flex:1;background:none;border:0;padding:10px 0;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--gerua);color:var(--black)}
#reader{width:100%;min-height:220px;background:#000;border-radius:8px;overflow:hidden;margin-top:12px}
#reader video{width:100%!important;display:block}
.status{margin-top:12px;font-weight:600}
.status.err{color:var(--tomato)}
.portion-name{font-size:1.2rem;font-weight:800;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{background:var(--soft);padding:4px 8px;border-radius:4px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.search{margin-top:12px}

/* history */
.hist li{cursor:pointer}
.hbar{height:6px;background:var(--soft);margin-top:5px;position:relative;overflow:hidden}
.hbar i{position:absolute;inset:0 auto 0 0;background:var(--gerua)}
.hbar i.over{background:var(--tomato)}
.empty{color:var(--muted);padding:12px 0}
h2.page{font-size:1.9rem;font-weight:900;font-stretch:72%;margin:8px 0 6px;border-bottom:10px solid var(--gerua);padding-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:var(--gerua);padding:10px 16px;border-radius:6px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="brand"><svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="0"><circle cx="12" cy="8.5" r="5"/><path d="M2 31c0-8.5 4.3-13.5 10-13.5s10 5 10 13.5z"/><path d="M18.5 20.5l7-7" stroke-width="3.2" stroke-linecap="round" fill="none"/><path d="M27 30V9M24.5 2.5v4.2a2.5 2.5 0 0 0 5 0V2.5M27 2.5v4" stroke-width="2" stroke-linecap="round" fill="none"/></svg>MeraFood</header>
<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="Main">
  <button data-tab="today" aria-current="page">Today</button>
  <button data-tab="history">History</button>
  <button data-tab="settings">Settings</button>
</nav>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- storage ---------- */
const KEY = "merafood.v1";
const blank = () => ({ settings:{ weight:70, goal:2000 }, days:{}, foods:[] });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch { S = blank(); }
S.settings ??= { weight:70, goal:2000 }; S.days ??= {}; S.foods ??= [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("Couldn't save. Storage may be full."); } }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const day = k => (S.days[k] ??= { food:[], ex:[] });
const MEALS = ["Breakfast","Lunch","Dinner","Snacks"];
function guessMeal(){ const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 21 ? "Dinner" : "Snacks"; }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function totals(k){
  const d = S.days[k] || { food:[], ex:[] };
  const t = { kcal:0, p:0, c:0, f:0, fi:0, su:0, sf:0, na:0, burned:0 };
  d.food.forEach(e => { t.kcal += e.kcal; t.p += e.p; t.c += e.c; t.f += e.f; t.fi += e.fi||0; t.su += e.su||0; t.sf += e.sf||0; t.na += e.na||0; });
  d.ex.forEach(e => { t.burned += e.kcal; });
  return t;
}
function niceDate(k){
  const t = todayKey(), d = fromKey(k);
  const y = new Date(); y.setDate(y.getDate()-1);
  const label = d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
  if (k === t) return "Today, " + label;
  if (k === keyOf(y)) return "Yesterday, " + label;
  return label;
}

/* ---------- exercise list (MET values, Compendium of Physical Activities) ---------- */
const ACTIVITIES = [
  ["Walking, moderate pace",3.5],["Walking, brisk",4.3],["Hiking",6.0],["Running, 10 km/h",9.8],["Running, 12 km/h",11.5],
  ["Cycling, leisurely",4.0],["Cycling, moderate",8.0],["Swimming, moderate",5.8],["Weight training",3.5],["Weight training, hard",6.0],
  ["HIIT / circuit",8.0],["Elliptical",5.0],["Stair climber",9.0],["Jump rope",12.3],["Yoga",2.5],["Dancing",5.0],
  ["Football / soccer",7.0],["Basketball",6.5],["Housework, cleaning",3.3]
];

/* ---------- app state ---------- */
let tab = "today";
let cur = todayKey();

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  if (tab === "today") renderToday();
  else if (tab === "history") renderHistory();
  else renderSettings();
}

/* ---------- today ---------- */
function renderToday(){
  const d = day(cur), t = totals(cur), goal = S.settings.goal;
  const remaining = goal - t.kcal + t.burned;
  const pct = Math.min(100, goal ? (t.kcal - t.burned) / goal * 100 : 0);
  const isToday = cur === todayKey();
  let html = `
  <div class="datebar">
    <button class="iconbtn" id="prev" aria-label="Previous day">‹</button>
    <h1>${esc(niceDate(cur))}</h1>
    <button class="iconbtn" id="next" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button>
  </div>
  <div class="label">
    <p class="title">Calories</p>
    <div class="rule-thick"></div>
    <div class="row"><span>Daily goal</span><b>${r0(goal)}</b></div>
    <div class="row"><span>Food</span><b>− ${r0(t.kcal)}</b></div>
    <div class="row"><span>Exercise</span><b>+ ${r0(t.burned)}</b></div>
    <div class="rule-mid"></div>
    <div class="remain">
      <span class="cap">${remaining < 0 ? "Over by" : "Remaining"}</span>
      <span class="big ${remaining < 0 ? "over" : ""}">${r0(Math.abs(remaining))}</span>
    </div>
    <div class="bar" aria-hidden="true"><i class="${remaining < 0 ? "over" : ""}" style="width:${Math.max(0,pct)}%"></i></div>
    <div class="macros">
      <div><b>${r0(t.p)} g</b><span>Protein</span></div>
      <div><b>${r0(t.c)} g</b><span>Carbs</span></div>
      <div><b>${r0(t.f)} g</b><span>Fat</span></div>
    </div>
    <div class="macros four">
      <div><b>${r0(t.fi)} g</b><span>Fiber</span></div>
      <div><b>${r0(t.su)} g</b><span>Sugar</span></div>
      <div><b>${r0(t.sf)} g</b><span>Sat fat</span></div>
      <div><b>${r0(t.na)} mg</b><span>Sodium</span></div>
    </div>
  </div>`;
  MEALS.forEach(m => {
    const items = d.food.filter(e => e.meal === m);
    const sum = items.reduce((a,e) => ({ kcal:a.kcal+e.kcal, p:a.p+e.p, c:a.c+e.c, f:a.f+e.f, fi:a.fi+(e.fi||0), su:a.su+(e.su||0), sf:a.sf+(e.sf||0), na:a.na+(e.na||0) }), { kcal:0, p:0, c:0, f:0, fi:0, su:0, sf:0, na:0 });
    html += `<section class="meal"><div class="mhead"><h2>${m}</h2><span>${r0(sum.kcal)} kcal</span></div>
      ${items.length ? `<div class="mmac"><span>Protein <b>${r0(sum.p)} g</b></span><span>Carbs <b>${r0(sum.c)} g</b></span><span>Fat <b>${r0(sum.f)} g</b></span><span>Fiber <b>${r0(sum.fi)} g</b></span><span>Sugar <b>${r0(sum.su)} g</b></span><span>Sat fat <b>${r0(sum.sf)} g</b></span><span>Sodium <b>${r0(sum.na)} mg</b></span></div>` : ""}
      <ul class="items">`;
    items.forEach(e => {
      html += `<li><div class="it-main"><div class="it-name">${esc(e.name)}</div><div class="it-sub">${esc(e.amount)} · P ${r0(e.p)} · C ${r0(e.c)} · F ${r0(e.f)}</div></div>
      <span class="it-kcal">${r0(e.kcal)}</span><button class="del" data-del-food="${e.id}" aria-label="Remove ${esc(e.name)}">✕</button></li>`;
    });
    html += `</ul><button class="addline" data-add-meal="${m}">+ Add food</button></section>`;
  });
  const exSum = d.ex.reduce((a,e) => a + e.kcal, 0);
  html += `<section class="meal"><div class="mhead"><h2>Exercise</h2><span>${r0(exSum)} kcal</span></div><ul class="items">`;
  d.ex.forEach(e => {
    html += `<li><div class="it-main"><div class="it-name">${esc(e.name)}</div><div class="it-sub">${e.min ? e.min + " min" : "Custom"}</div></div>
    <span class="it-kcal">${r0(e.kcal)}</span><button class="del" data-del-ex="${e.id}" aria-label="Remove ${esc(e.name)}">✕</button></li>`;
  });
  html += `</ul><button class="addline" id="addEx">+ Add exercise</button></section>`;
  $("#app").innerHTML = html;

  $("#prev").onclick = () => { const x = fromKey(cur); x.setDate(x.getDate()-1); cur = keyOf(x); render(); };
  $("#next").onclick = () => { const x = fromKey(cur); x.setDate(x.getDate()+1); cur = keyOf(x); render(); };
  $("#addEx").onclick = openExercise;
  document.querySelectorAll("[data-add-meal]").forEach(b => b.onclick = () => openFood(b.dataset.addMeal));
  document.querySelectorAll("[data-del-food]").forEach(b => b.onclick = () => { d.food = d.food.filter(e => e.id !== b.dataset.delFood); save(); render(); });
  document.querySelectorAll("[data-del-ex]").forEach(b => b.onclick = () => { d.ex = d.ex.filter(e => e.id !== b.dataset.delEx); save(); render(); });
}

/* ---------- sheet ---------- */
const sheet = $("#sheet");
function openSheet(html){ $("#sheetBody").innerHTML = html; if (!sheet.open) sheet.showModal(); }
function closeSheet(){ stopScan(); if (sheet.open) sheet.close(); }
sheet.addEventListener("close", stopScan);
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
const head = title => `<div class="shead"><h3>${title}</h3><button class="iconbtn" data-close aria-label="Close">✕</button></div>`;
function wireClose(){ document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet); }
const mealSelect = sel => `<label class="f">Meal<select id="meal">${MEALS.map(m => `<option ${m===sel?"selected":""}>${m}</option>`).join("")}</select></label>`;

/* ---------- add food ---------- */
let foodMeal = "Breakfast", foodMode = "scan";
function openFood(meal){ foodMeal = meal || guessMeal(); showFoodTabs(foodMode); }

function showFoodTabs(mode){
  foodMode = mode; stopScan();
  const seg = ["scan","manual","mine"].map(m => `<button data-mode="${m}" aria-pressed="${m===mode}">${{scan:"Scan",manual:"Enter",mine:"My foods"}[m]}</button>`).join("");
  let body = "";
  if (mode === "scan") body = `
    <div id="reader"></div>
    <p class="status" id="scanStatus">Point the camera at a barcode.</p>
    <label class="f">Or type the barcode<input id="codeIn" inputmode="numeric" placeholder="e.g. 3017620422003"></label>
    <button class="secondary" id="codeGo" style="margin-top:10px">Look up</button>`;
  else if (mode === "manual") body = manualForm({});
  else body = `
    <label class="f search">Search<input id="q" placeholder="Name or brand"></label>
    <ul class="items" id="mineList"></ul>`;
  openSheet(head("Add to " + foodMeal) + `<div class="seg">${seg}</div>` + body);
  wireClose();
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => showFoodTabs(b.dataset.mode));
  if (mode === "scan"){
    $("#codeGo").onclick = () => { const c = $("#codeIn").value.replace(/\D/g,""); if (c) handleCode(c); };
    startScan();
  } else if (mode === "manual") wireManual({});
  else { const draw = () => drawMine($("#q").value); $("#q").oninput = draw; draw(); }
}

function manualForm(pre){
  return `
    <label class="f">Food name<input id="mName" value="${esc(pre.name||"")}" placeholder="e.g. Chicken rice bowl"></label>
    <label class="f">Calories (kcal)<input id="mKcal" type="number" inputmode="decimal" min="0" value="${pre.kcal ?? ""}"></label>
    <div class="grid2">
      <label class="f">Protein (g)<input id="mP" type="number" inputmode="decimal" min="0" value="${pre.p ?? ""}"></label>
      <label class="f">Carbs (g)<input id="mC" type="number" inputmode="decimal" min="0" value="${pre.c ?? ""}"></label>
      <label class="f">Fat (g)<input id="mF" type="number" inputmode="decimal" min="0" value="${pre.f ?? ""}"></label>
      <label class="f">Fiber (g)<input id="mFi" type="number" inputmode="decimal" min="0" value="${pre.fi ?? ""}"></label>
      <label class="f">Sugar (g)<input id="mSu" type="number" inputmode="decimal" min="0" value="${pre.su ?? ""}"></label>
      <label class="f">Sat fat (g)<input id="mSf" type="number" inputmode="decimal" min="0" value="${pre.sf ?? ""}"></label>
      <label class="f">Sodium (mg)<input id="mNa" type="number" inputmode="decimal" min="0" value="${pre.na ?? ""}"></label>
      <label class="f">Servings<input id="mQty" type="number" inputmode="decimal" min="0" step="0.25" value="1"></label>
    </div>
    <p class="note">Enter the values for one serving. Leave any you don't know blank.</p>
    ${mealSelect(foodMeal)}
    <label class="check"><input type="checkbox" id="mSave" checked> Save to My foods</label>
    <button class="primary" id="mAdd">Add food</button>`;
}
function wireManual(pre){
  $("#mAdd").onclick = () => {
    const name = $("#mName").value.trim(), kcal = parseFloat($("#mKcal").value);
    if (!name){ toast("Add a food name"); return; }
    if (!(kcal >= 0)){ toast("Add the calories"); return; }
    const food = { id:uid(), name, brand:"", barcode:pre.barcode||"", unit:"serving", base:1, defaultQty:1,
      kcal, p:parseFloat($("#mP").value)||0, c:parseFloat($("#mC").value)||0, f:parseFloat($("#mF").value)||0,
      fi:parseFloat($("#mFi").value)||0, su:parseFloat($("#mSu").value)||0, sf:parseFloat($("#mSf").value)||0, na:parseFloat($("#mNa").value)||0 };
    if ($("#mSave").checked) upsertFood(food);
    addEntry(food, parseFloat($("#mQty").value) || 1, $("#meal").value);
  };
}

function upsertFood(food){
  const i = S.foods.findIndex(x => (food.barcode && x.barcode === food.barcode) || (x.name.toLowerCase() === food.name.toLowerCase() && x.unit === food.unit && x.brand === food.brand));
  if (i >= 0) { food.id = S.foods[i].id; S.foods[i] = food; } else S.foods.unshift(food);
  save();
}

function drawMine(q){
  q = (q||"").toLowerCase();
  const list = S.foods.filter(f => !q || f.name.toLowerCase().includes(q) || (f.brand||"").toLowerCase().includes(q));
  const ul = $("#mineList");
  if (!S.foods.length){ ul.innerHTML = `<li class="empty">Foods you scan or enter are saved here for next time.</li>`; return; }
  if (!list.length){ ul.innerHTML = `<li class="empty">No match for "${esc(q)}".</li>`; return; }
  ul.innerHTML = list.map(f => `<li>
    <div class="it-main" data-pick="${f.id}" style="cursor:pointer"><div class="it-name">${esc(f.name)}</div>
    <div class="it-sub">${esc(f.brand ? f.brand + " · " : "")}${r0(f.kcal)} kcal per ${f.unit === "g" ? "100 g" : "serving"}</div></div>
    <button class="del" data-forget="${f.id}" aria-label="Remove ${esc(f.name)} from My foods">✕</button></li>`).join("");
  ul.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => showPortion(S.foods.find(f => f.id === el.dataset.pick)));
  ul.querySelectorAll("[data-forget]").forEach(b => b.onclick = () => { S.foods = S.foods.filter(f => f.id !== b.dataset.forget); save(); drawMine($("#q").value); });
}

function showPortion(food){
  stopScan();
  const unitLabel = food.unit === "g" ? "Amount (g)" : "Servings";
  openSheet(head("Add to " + foodMeal) + `
    <p class="portion-name">${esc(food.name)}</p>
    ${food.brand ? `<p class="note" style="margin-top:2px">${esc(food.brand)}</p>` : ""}
    <p class="note">Per ${food.unit === "g" ? "100 g" : "serving"}: ${r0(food.kcal)} kcal · P ${r1(food.p)} · C ${r1(food.c)} · F ${r1(food.f)}<br>Fiber ${r1(food.fi||0)} g · Sugar ${r1(food.su||0)} g · Sat fat ${r1(food.sf||0)} g · Sodium ${r0(food.na||0)} mg</p>
    <label class="f">${unitLabel}<input id="qty" type="number" inputmode="decimal" min="0" step="${food.unit === "g" ? 1 : 0.25}" value="${food.defaultQty}"></label>
    <div class="chips" id="calc"></div>
    ${mealSelect(foodMeal)}
    <button class="primary" id="pAdd">Add food</button>
    <button class="addline" id="back">‹ Back</button>`);
  wireClose();
  const calc = () => {
    const q = parseFloat($("#qty").value) || 0, m = q / food.base;
    $("#calc").innerHTML = `<span>${r0(food.kcal*m)} kcal</span><span>Protein ${r1(food.p*m)} g</span><span>Carbs ${r1(food.c*m)} g</span><span>Fat ${r1(food.f*m)} g</span><span>Fiber ${r1((food.fi||0)*m)} g</span><span>Sugar ${r1((food.su||0)*m)} g</span><span>Sat fat ${r1((food.sf||0)*m)} g</span><span>Sodium ${r0((food.na||0)*m)} mg</span>`;
  };
  $("#qty").oninput = calc; calc();
  $("#back").onclick = () => showFoodTabs(foodMode);
  $("#pAdd").onclick = () => {
    const q = parseFloat($("#qty").value);
    if (!(q > 0)){ toast("Enter an amount"); return; }
    food.defaultQty = q; upsertFood(food);
    addEntry(food, q, $("#meal").value);
  };
}

function addEntry(food, qty, meal){
  const m = qty / food.base;
  const amount = food.unit === "g" ? `${r0(qty)} g` : `${r1(qty)} serving${qty === 1 ? "" : "s"}`;
  day(cur).food.push({ id:uid(), meal, name:food.name, amount, kcal:food.kcal*m, p:food.p*m, c:food.c*m, f:food.f*m,
    fi:(food.fi||0)*m, su:(food.su||0)*m, sf:(food.sf||0)*m, na:(food.na||0)*m });
  save(); closeSheet(); render(); toast("Added to " + meal);
}

/* ---------- barcode scanning ---------- */
let scanner = null, scanBusy = false;
async function startScan(){
  const status = $("#scanStatus");
  if (!window.Html5Qrcode){ status.textContent = "Scanner couldn't load. Check your connection, or type the barcode."; status.className = "status err"; return; }
  if (!window.isSecureContext){ status.textContent = "Camera needs an https:// address. Type the barcode instead."; status.className = "status err"; return; }
  try {
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode("reader", { formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E], experimentalFeatures:{ useBarCodeDetectorIfSupported:true }, verbose:false });
    scanBusy = false;
    await scanner.start({ facingMode:"environment" }, { fps:10, qrbox:(w,h) => ({ width:Math.min(280, w*0.85), height:Math.min(150, h*0.6) }) },
      code => { if (scanBusy) return; scanBusy = true; if (navigator.vibrate) navigator.vibrate(60); stopScan(); handleCode(code); }, () => {});
  } catch (e){
    status.textContent = "Camera not available. Allow camera access, or type the barcode.";
    status.className = "status err";
  }
}
function stopScan(){
  if (!scanner) return;
  const s = scanner; scanner = null;
  try { if (s.isScanning) s.stop().then(() => s.clear()).catch(() => {}); else s.clear(); } catch {}
}

async function handleCode(code){
  const known = S.foods.find(f => f.barcode === code);
  if (known){ showPortion(known); return; }
  openSheet(head("Add to " + foodMeal) + `<p class="status">Looking up ${esc(code)}…</p>`);
  wireClose();
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`);
    const j = await res.json();
    const p = j && j.status === 1 ? j.product : null;
    const n = (p && p.nutriments) || {};
    let kcal = n["energy-kcal_100g"];
    if (kcal == null && n["energy_100g"] != null) kcal = n["energy_100g"] / 4.184;
    if (!p || kcal == null){
      showMissing(code, p && p.product_name, "This product isn't in the food database yet, or has no calorie info. Enter it once and it'll be saved for next time.");
      return;
    }
    const serving = parseFloat(p.serving_quantity);
    showPortion({ id:uid(), barcode:code, name:p.product_name || "Unnamed product", brand:(p.brands||"").split(",")[0].trim(),
      unit:"g", base:100, defaultQty: serving > 0 ? r0(serving) : 100,
      kcal:+kcal, p:+(n.proteins_100g||0), c:+(n.carbohydrates_100g||0), f:+(n.fat_100g||0),
      fi:+(n.fiber_100g||0), su:+(n.sugars_100g||0), sf:+(n["saturated-fat_100g"]||0),
      na: n.sodium_100g != null ? n.sodium_100g*1000 : (n.salt_100g != null ? n.salt_100g/2.5*1000 : 0) });
  } catch {
    showMissing(code, "", "Couldn't reach the food database. Check your connection, or enter the food yourself.");
  }
}
function showMissing(code, name, msg){
  openSheet(head("Add to " + foodMeal) + `<p class="status err">${esc(msg)}</p>` + manualForm({ name:name||"", barcode:code }));
  wireClose(); wireManual({ barcode:code });
}

/* ---------- exercise ---------- */
function openExercise(){
  const opts = ACTIVITIES.map(([n,m],i) => `<option value="${i}">${n}</option>`).join("") + `<option value="custom">Other (enter calories)</option>`;
  openSheet(head("Add exercise") + `
    <label class="f">Activity<select id="act">${opts}</select></label>
    <div id="exFields"></div>
    <div class="chips" id="exCalc"></div>
    <button class="primary" id="exAdd">Add exercise</button>
    <p class="note">Estimate based on your weight (${r1(S.settings.weight)} kg). Change it in Settings.</p>`);
  wireClose();
  const draw = () => {
    const custom = $("#act").value === "custom";
    $("#exFields").innerHTML = custom
      ? `<label class="f">Name<input id="exName" placeholder="e.g. Badminton"></label><label class="f">Calories burned<input id="exKcal" type="number" inputmode="decimal" min="0"></label>`
      : `<label class="f">Minutes<input id="exMin" type="number" inputmode="numeric" min="0" value="30"></label>`;
    const upd = () => {
      if (custom){ $("#exCalc").innerHTML = ""; return; }
      const [, met] = ACTIVITIES[+$("#act").value];
      $("#exCalc").innerHTML = `<span>≈ ${r0(met * S.settings.weight * ((parseFloat($("#exMin").value)||0)/60))} kcal</span>`;
    };
    if (!custom) $("#exMin").oninput = upd;
    upd();
  };
  $("#act").onchange = draw; draw();
  $("#exAdd").onclick = () => {
    const v = $("#act").value;
    let entry;
    if (v === "custom"){
      const name = $("#exName").value.trim() || "Exercise", kcal = parseFloat($("#exKcal").value);
      if (!(kcal > 0)){ toast("Enter calories burned"); return; }
      entry = { id:uid(), name, min:0, kcal };
    } else {
      const [name, met] = ACTIVITIES[+v], min = parseFloat($("#exMin").value);
      if (!(min > 0)){ toast("Enter minutes"); return; }
      entry = { id:uid(), name, min, kcal: met * S.settings.weight * (min/60) };
    }
    day(cur).ex.push(entry); save(); closeSheet(); render(); toast("Exercise added");
  };
}

/* ---------- history ---------- */
function renderHistory(){
  const goal = S.settings.goal;
  let html = `<h2 class="page">History</h2><ul class="items hist">`;
  let any = false;
  for (let i = 0; i < 30; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = keyOf(d), t = totals(k);
    if (i > 0 && !t.kcal && !t.burned) continue;
    any = any || !!(t.kcal || t.burned);
    const net = t.kcal - t.burned, pct = goal ? Math.min(100, net/goal*100) : 0;
    html += `<li data-day="${k}"><div class="it-main"><div class="it-name">${esc(niceDate(k))}</div>
      <div class="it-sub">Food ${r0(t.kcal)} · Exercise ${r0(t.burned)} · P ${r0(t.p)} C ${r0(t.c)} F ${r0(t.f)}</div>
      <div class="hbar"><i class="${net > goal ? "over" : ""}" style="width:${Math.max(0,pct)}%"></i></div></div>
      <span class="it-kcal">${r0(net)}</span></li>`;
  }
  html += `</ul>`;
  if (!any) html += `<p class="empty">Days you log will show up here.</p>`;
  else html += `<p class="note">Right-hand number is net calories (food minus exercise). Tap a day to open it.</p>`;
  $("#app").innerHTML = html;
  document.querySelectorAll("[data-day]").forEach(li => li.onclick = () => { cur = li.dataset.day; tab = "today"; render(); window.scrollTo(0,0); });
}

/* ---------- settings ---------- */
function renderSettings(){
  $("#app").innerHTML = `
    <h2 class="page">Settings</h2>
    <div class="grid2">
      <label class="f">Daily calorie goal<input id="sGoal" type="number" inputmode="numeric" min="0" value="${r0(S.settings.goal)}"></label>
      <label class="f">Body weight (kg)<input id="sWeight" type="number" inputmode="decimal" min="1" step="0.1" value="${r1(S.settings.weight)}"></label>
    </div>
    <p class="note">Weight is used to estimate calories burned during exercise.</p>
    <button class="primary" id="sSave">Save settings</button>

    <h2 class="page" style="margin-top:34px">Your data</h2>
    <p class="note">Everything is stored only on this phone, in this browser. Export a backup now and then so you don't lose it if browser data gets cleared.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="secondary" id="exp">Export backup</button>
      <button class="secondary" id="imp">Import backup</button>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
      <button class="secondary danger" id="wipe">Delete all data</button>
    </div>
    <p class="note" style="margin-top:28px">Food data from Open Food Facts (openfoodfacts.org), a free, open database.</p>`;
  $("#sSave").onclick = () => {
    const g = parseFloat($("#sGoal").value), w = parseFloat($("#sWeight").value);
    if (!(g > 0) || !(w > 0)){ toast("Enter a goal and weight above zero"); return; }
    S.settings.goal = g; S.settings.weight = w; save(); toast("Settings saved");
  };
  $("#exp").onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `merafood-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("#imp").onclick = () => $("#impFile").click();
  $("#impFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || typeof data.days !== "object") throw 0;
      if (!confirm("Replace the data on this phone with this backup?")) return;
      S = { settings: data.settings || blank().settings, days: data.days, foods: data.foods || [] };
      save(); toast("Backup imported"); render();
    } catch { toast("That file isn't a MeraFood backup"); }
  };
  $("#wipe").onclick = () => {
    if (!confirm("Delete all your logs, foods and settings? This can't be undone.")) return;
    S = blank(); save(); cur = todayKey(); toast("All data deleted"); render();
  };
}

/* ---------- boot ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; if (tab === "today") cur = cur || todayKey(); render(); window.scrollTo(0,0); });
render();
</script>
